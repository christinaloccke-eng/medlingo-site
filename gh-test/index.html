<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedLingo — GH Stim Test · Phase 4 Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --ink-mid: #4a4a44;
    --ink-light: #8a8a80;
    --ink-faint: #b5b1a8;
    --paper: #f7f4ee;
    --paper-warm: #ede9df;
    --paper-dark: #e2ddd3;
    --paper-deep: #d6cfc2;

    --accent: #c4530a;
    --accent-light: #f0e8df;
    --accent-soft: #fbf3e9;

    --teal: #1a6b5a;
    --teal-light: #dff0eb;
    --amber: #8b5e08;
    --amber-light: #f5eddb;
    --blue: #1a4a7a;
    --blue-light: #deeaf5;
    --green: #2d5a1a;
    --green-light: #e4f0dc;
    --rose: #8a1a3a;
    --rose-light: #f3dde4;

    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --mono: 'DM Mono', monospace;

    --shadow-sm: 0 1px 3px rgba(26,26,24,.06);
    --shadow-md: 0 4px 16px rgba(26,26,24,.08);
    --shadow-lg: 0 12px 36px rgba(26,26,24,.16);

    /* D1 · user-adjustable text scale (1 = default, set live from the A−/A/A+ control) */
    --fs: 1;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper-warm);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  button:disabled { cursor: not-allowed; opacity: .55; }

  /* ───── App frame ───── */
  .app {
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 720px) {
    .app { margin-top: 2rem; margin-bottom: 2rem; min-height: calc(100vh - 4rem); border-radius: 14px; }
    body { padding: 0 1rem; }
  }

  /* ───── Onboarding ───── */
  .onb {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 2rem 1.75rem 1.5rem;
  }

  .onb-step-indicator {
    display: flex;
    gap: 5px;
    margin-bottom: 2rem;
  }
  .onb-step-dot {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: var(--paper-dark);
    transition: background .3s;
  }
  .onb-step-dot.done { background: var(--accent); }
  .onb-step-dot.current { background: var(--ink); }

  .onb-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: .8rem;
  }

  .onb-title {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: .6rem;
    color: var(--ink);
  }
  .onb-title em { font-style: italic; color: var(--accent); }

  .onb-sub {
    font-size: 14px;
    color: var(--ink-mid);
    margin-bottom: 2rem;
    line-height: 1.55;
  }

  .onb-options { display: flex; flex-direction: column; gap: .55rem; }

  .onb-opt {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 8px;
    padding: 1rem 1.1rem;
    transition: all .15s;
    display: flex;
    align-items: flex-start;
    gap: .85rem;
  }
  .onb-opt:hover { border-color: var(--ink-mid); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .onb-opt:active { transform: translateY(0); }

  .onb-opt-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--paper-warm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: var(--serif);
    font-size: 16px;
    color: var(--ink-mid);
  }
  .onb-opt-body { flex: 1; min-width: 0; }
  .onb-opt-title { font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.3; }
  .onb-opt-sub { font-size: 12px; color: var(--ink-light); margin-top: 2px; line-height: 1.4; }

  .onb-back {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--ink-light);
    margin-bottom: 1rem;
    padding: 4px 0;
  }
  .onb-back:hover { color: var(--ink); }

  /* ───── Status bar (top of phase 4) ───── */
  .status {
    background: var(--ink);
    color: var(--paper);
    padding: .85rem 1.25rem .75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .status-left { display: flex; flex-direction: column; gap: 2px; }
  .status-phase {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .status-step {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
  }

  .status-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .status-clock {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .04em;
  }
  .status-meta {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    color: rgba(247,244,238,.7);
    text-transform: uppercase;
  }

  /* ───── Demo control strip ───── */
  .demobar {
    background: var(--paper-warm);
    border-bottom: 1px solid var(--paper-dark);
    padding: .5rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--ink-mid);
    text-transform: uppercase;
  }
  .demobar-tag {
    background: var(--accent);
    color: var(--paper);
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 9px;
    letter-spacing: .12em;
  }
  .demobar-controls { margin-left: auto; display: flex; gap: 6px; }
  .demobar-btn {
    font-family: var(--mono);
    font-size: 9.5px;
    padding: 4px 8px;
    border-radius: 3px;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    color: var(--ink-mid);
    letter-spacing: .06em;
  }
  .demobar-btn:hover { border-color: var(--ink-mid); }
  .demobar-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ───── Voice preview switch ───── */
  .voicebar {
    background: var(--paper);
    border-bottom: 1px solid var(--paper-dark);
    padding: .55rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .voicebar-label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-light);
  }
  .voicebar-btn {
    font-family: var(--mono);
    font-size: 9.5px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--paper-warm);
    color: var(--ink-mid);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .voicebar-btn.active { background: var(--ink); color: var(--paper); }

  /* ───── Main scroll content ───── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 1.25rem 6rem;
  }

  /* ───── Timeline ───── */
  .tl-section { margin-bottom: 1.5rem; }
  .section-head {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: .6rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-head::after { content:''; flex:1; height:1px; background: var(--paper-dark); }

  .tl-card {
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 10px;
    padding: 1rem 1.1rem 1.1rem;
  }

  .tl-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .1em;
    color: var(--ink-light);
    margin-bottom: .75rem;
    text-transform: uppercase;
  }

  .tl-track {
    position: relative;
    height: 60px;
    margin: 0 4px 4px;
  }

  .tl-line {
    position: absolute;
    top: 28px;
    left: 0; right: 0;
    height: 2px;
    background: var(--paper-dark);
    border-radius: 1px;
  }

  .tl-line-fill {
    position: absolute;
    top: 28px;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent));
    border-radius: 1px;
    transition: width .5s ease;
  }

  .tl-tick {
    position: absolute;
    top: 22px;
    transform: translateX(-50%);
    cursor: pointer;
  }

  .tl-tick-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--paper-deep);
    transition: all .2s;
  }
  .tl-tick.done .tl-tick-dot { background: var(--accent); border-color: var(--accent); }
  .tl-tick.active .tl-tick-dot {
    background: var(--ink);
    border-color: var(--ink);
    box-shadow: 0 0 0 4px rgba(26,26,24,.12);
  }
  .tl-tick.upcoming .tl-tick-dot { background: var(--paper); }

  .tl-tick-label {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--ink-light);
    white-space: nowrap;
  }
  .tl-tick.active .tl-tick-label { color: var(--ink); font-weight: 500; }

  .tl-pointer {
    position: absolute;
    top: -2px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    letter-spacing: .08em;
    transition: left .5s ease;
    font-weight: 500;
  }

  /* ───── Current step card ───── */
  .step {
    background: linear-gradient(135deg, var(--accent-soft), var(--paper));
    border: 1px solid var(--paper-dark);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 1.1rem 1.2rem 1.3rem;
    margin-bottom: 1rem;
  }
  .step-eyebrow {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .35rem;
  }
  .step-title {
    font-family: var(--serif);
    font-size: calc(20px * var(--fs));
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: .55rem;
    color: var(--ink);
  }
  .step-body {
    font-size: calc(14px * var(--fs));
    color: var(--ink-mid);
    line-height: 1.6;
    margin-bottom: .85rem;
  }
  .step-body .term {
    border-bottom: 1px dashed var(--ink-faint);
    cursor: pointer;
    color: var(--ink);
  }
  .step-body .term:hover { border-bottom-style: solid; color: var(--accent); }

  .step-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
  .chip {
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    color: var(--ink-mid);
    padding: 6px 12px;
    border-radius: 999px;
    transition: all .15s;
    font-weight: 500;
  }
  .chip:hover { border-color: var(--ink-mid); color: var(--ink); }
  .chip.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.primary:hover { background: var(--accent); border-color: var(--accent); }

  /* ───── Listen button (audio TTS) ───── */
  .listen {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-mid);
    font-size: 13px;
  }
  .listen:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .listen.speaking { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  .step { position: relative; }

  /* ───── Logged symptoms list ───── */
  .log {
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    border-radius: 10px;
    padding: .9rem 1.1rem 1rem;
    margin-bottom: 1rem;
  }
  .log-head {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: .5rem;
    display: flex;
    justify-content: space-between;
  }
  .log-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px dashed var(--paper-dark);
    font-size: 13px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-row-left { display: flex; gap: 8px; align-items: center; }
  .log-row-time { font-family: var(--mono); font-size: 11px; color: var(--ink-light); }
  .log-row-symptom { color: var(--ink); font-weight: 500; }
  .log-tier {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    padding: 2px 7px;
    border-radius: 2px;
    text-transform: uppercase;
  }
  .log-tier.t1 { background: var(--amber-light); color: var(--amber); }
  .log-tier.t2 { background: var(--accent-light); color: var(--accent); }
  .log-tier.t3 { background: var(--rose-light); color: var(--rose); }

  /* ───── Action dock ───── */
  .dock {
    position: sticky;
    bottom: 0;
    left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--paper-dark);
    padding: .7rem 1rem .9rem;
    display: flex;
    gap: .55rem;
    box-shadow: 0 -4px 12px rgba(26,26,24,.04);
  }

  .dock-btn {
    flex: 1;
    padding: .85rem .7rem;
    border-radius: 10px;
    background: var(--paper-warm);
    border: 1px solid var(--paper-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: all .15s;
  }
  .dock-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .dock-btn-icon { font-size: 16px; line-height: 1; }
  .dock-btn-label { font-size: 11px; font-weight: 500; color: var(--ink-mid); letter-spacing: .02em; }
  .dock-btn.primary { background: var(--ink); border-color: var(--ink); }
  .dock-btn.primary .dock-btn-label { color: var(--paper); }
  .dock-btn.primary .dock-btn-icon { color: var(--accent); }

  /* ───── Sheet (modal) ───── */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(26,26,24,.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px 16px 0 0;
    padding: 1.5rem 1.5rem 2rem;
    animation: slideUp .3s cubic-bezier(.16,.84,.44,1);
    position: relative;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  @media (min-width: 720px) {
    .sheet-backdrop { align-items: center; }
    .sheet { border-radius: 16px; max-height: 80vh; }
  }

  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--paper-deep);
    border-radius: 2px;
    margin: -.25rem auto 1rem;
  }
  .sheet-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: .4rem;
  }
  .sheet-title {
    font-family: var(--serif);
    font-size: calc(22px * var(--fs));
    font-weight: 600;
    line-height: 1.25;
    margin-bottom: .6rem;
  }
  .sheet-body {
    font-size: calc(14px * var(--fs));
    color: var(--ink-mid);
    line-height: 1.6;
  }
  .sheet-close {
    position: absolute;
    top: 1.1rem;
    right: 1.25rem;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--paper-warm);
    color: var(--ink-mid);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet-close:hover { background: var(--ink); color: var(--paper); }

  /* ───── Symptom check-in grid ───── */
  .sx-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: .55rem;
    margin: 1rem 0;
  }
  .sx-btn {
    background: var(--paper-warm);
    border: 1px solid var(--paper-dark);
    border-radius: 10px;
    padding: .9rem .85rem;
    text-align: left;
    transition: all .15s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sx-btn:hover { transform: translateY(-1px); border-color: var(--ink-mid); }
  .sx-btn-emoji { font-size: 22px; line-height: 1; margin-bottom: 4px; }
  .sx-btn-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .sx-btn-tier { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; color: var(--ink-light); text-transform: uppercase; }
  .sx-btn.t1 { background: var(--amber-light); }
  .sx-btn.t2 { background: var(--accent-light); }
  .sx-btn.t3 { background: var(--rose-light); }
  .sx-btn.t3 .sx-btn-tier { color: var(--rose); }

  .sx-feel-good {
    background: var(--green-light);
    border: 1px solid var(--paper-dark);
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
    margin-top: .5rem;
  }
  .sx-feel-good-title { font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--green); }
  .sx-feel-good-sub { font-size: 12.5px; color: var(--ink-mid); margin-top: 4px; }

  /* ───── Decision tree sheet ───── */
  .tree-tier-bar {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: .8rem;
  }
  .tree-tier-bar.t1 { background: var(--amber-light); color: var(--amber); }
  .tree-tier-bar.t2 { background: var(--accent-light); color: var(--accent); }
  .tree-tier-bar.t3 { background: var(--rose-light); color: var(--rose); }

  .tree-actions {
    background: var(--paper-warm);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-top: 1rem;
  }
  .tree-action-row {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--paper-dark);
    align-items: flex-start;
  }
  .tree-action-row:last-child { border-bottom: none; padding-bottom: 0; }
  .tree-action-row:first-child { padding-top: 0; }
  .tree-action-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-light);
    flex-shrink: 0;
    min-width: 18px;
    padding-top: 2px;
  }
  .tree-action-text { font-size: calc(13.5px * var(--fs)); color: var(--ink); line-height: 1.5; }

  .tree-cta-row {
    display: flex;
    gap: .55rem;
    margin-top: 1.1rem;
  }
  .tree-cta {
    flex: 1;
    padding: .85rem 1rem;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    text-align: center;
    transition: all .15s;
  }
  .tree-cta-primary { background: var(--ink); color: var(--paper); }
  .tree-cta-primary:hover { background: var(--accent); }
  .tree-cta-primary.t3 { background: var(--rose); }
  .tree-cta-secondary { background: var(--paper-warm); color: var(--ink); border: 1px solid var(--paper-dark); }

  /* ───── Medication sheet ───── */
  .med {
    background: var(--paper-warm);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    margin-bottom: .65rem;
    border-left: 3px solid var(--teal);
  }

  return `${h}:${mm.toString().padStart(2,'0')}`;
};

const findCurrentEvent = (elapsedMin) => {
  let current = EVENTS[0];
  for (const e of EVENTS) {
    if (e.tMin <= elapsedMin) current = e;
    else break;
  }
  return current;
};

const speak = (text, onEnd) => {
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return null; }
  window.speechSynthesis.cancel();
  // Strip HTML for TTS
  const clean = text.replace(/<[^>]+>/g, '').replace(/\s+/g,' ').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 0.9;   // E1 · slightly slower, clearer pace for spoken plain-language narration
  u.pitch = 1.0;
  if (onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
  return u;
};

const stopSpeak = () => { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); };

const Timeline = ({ elapsedMin, onTickClick }) => {
  const pct = Math.min(100, (elapsedMin / TOTAL_MIN) * 100);

  // Major ticks: every 30 min + the 6 blood draws (which already land on 15/30/60/90/120/150)
  const ticks = EVENTS.filter(e => e.type === 'draw');

  return (
    <div className="tl-section">
      <div className="section-head">PROCEDURE TIMELINE</div>
      <div className="tl-card">
        <div className="tl-meta">
          <span>0:00 START</span>
          <span>{pct.toFixed(0)}% COMPLETE</span>
          <span>3:00 END</span>
        </div>
        <div className="tl-track">
          <div className="tl-line"/>
          <div className="tl-line-fill" style={{width: `${pct}%`}}/>
          <div className="tl-pointer" style={{left: `${pct}%`}}>NOW</div>
          {ticks.map(t => {
            const left = (t.tMin / TOTAL_MIN) * 100;
            const status = t.tMin < elapsedMin - 0.5 ? 'done'
                         : Math.abs(t.tMin - elapsedMin) < 1.5 ? 'active'
                         : 'upcoming';
            return (
              <div
                key={t.id}
                className={`tl-tick ${status}`}
                style={{left: `${left}%`}}
                onClick={() => onTickClick && onTickClick(t)}>
                <div className="tl-tick-dot"/>
                <div className="tl-tick-label">DRAW {t.n}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

const StepCard = ({ event, voice, onTermClick }) => {
  const [speaking, setSpeaking] = useState(false);
  const content = V.step[event.id]?.[voice] || { title: event.label, body: '' };

  const handleListen = () => {
    if (speaking) { stopSpeak(); setSpeaking(false); return; }
    setSpeaking(true);
    speak(`${content.title}. ${content.body}`, () => setSpeaking(false));
  };

  // Handle .term clicks via delegation
  const bodyRef = useRef(null);
  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const onClick = (e) => {
      if (e.target.classList && e.target.classList.contains('term')) {
        const t = e.target.getAttribute('data-term');
        if (t && onTermClick) onTermClick(t);
      }
    };
    el.addEventListener('click', onClick);
    return () => el.removeEventListener('click', onClick);
  }, [onTermClick, content.body]);

  return (
    <div className="step">
      <button
        className={`listen ${speaking ? 'speaking':''}`}
        onClick={handleListen}
        title="Listen aloud"
        aria-label="Read this aloud">
        {speaking ? '◼' : '◀)'}
      </button>
      <div className="step-eyebrow">RIGHT NOW</div>
      <h2 className="step-title">{content.title}</h2>
      <div
        className="step-body"
        ref={bodyRef}
        dangerouslySetInnerHTML={{__html: content.body}}
      />
    </div>
  );
};

      <div className="about-row"><span className="about-label">Last reviewed</span><span className="about-val">{SOURCE.reviewed}</span></div>
      <div className="about-row"><span className="about-label">Provided by</span><span className="about-val">{SOURCE.org}</span></div>
    </div>
    <div className="about-note">
      This module explains what usually happens. It is not medical advice and does not replace your care team. If anything here is different from what your nurse or doctor tells you, <b>follow your care team</b>. Questions? Call {SOURCE.phone}.
    </div>
  </Sheet>
);

/* ============================================================
   Component: All-steps menu + single-step preview (D3)
   ============================================================ */

const AllStepsSheet = ({ elapsedMin, onPick, onClose }) => (
  <Sheet onClose={onClose}>
    <div className="sheet-eyebrow">ALL STEPS</div>
    <h2 className="sheet-title">Look back or ahead</h2>
    <p className="sheet-body">Tap any step to read it again or see what’s coming. This won’t change the test clock.</p>
    <div className="steps-list">
      {EVENTS.map(e => {
        const status = e.tMin < elapsedMin - 0.5 ? 'done'
                     : Math.abs(e.tMin - elapsedMin) < 5 ? 'now' : 'next';
        return (
          <button className="steps-row" key={e.id} onClick={() => onPick(e.id)}>
            <span className="steps-row-time">{minToClock(e.tMin)}</span>
            <span className="steps-row-label">{e.label}</span>
            <span className={`steps-row-tag ${status}`}>{status === 'done' ? 'Done' : status === 'now' ? 'Now' : 'Soon'}</span>
          </button>
        );
      })}
    </div>
  </Sheet>
);

const StepPreviewSheet = ({ eventId, voice, onClose, onTermClick }) => {
  const [speaking, setSpeaking] = useState(false);
  const ev = EVENTS.find(e => e.id === eventId);
  const content = V.step[eventId]?.[voice] || { title: ev?.label || '', body: '' };
  const bodyRef = useRef(null);
  const handleListen = () => {
    if (speaking) { stopSpeak(); setSpeaking(false); return; }
    setSpeaking(true);
    speak(`${content.title}. ${content.body}`, () => setSpeaking(false));
  };
  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const onClick = (e) => {
      if (e.target.classList && e.target.classList.contains('term')) {
        const t = e.target.getAttribute('data-term');
        if (t && onTermClick) onTermClick(t);
      }
    };
    el.addEventListener('click', onClick);
    return () => el.removeEventListener('click', onClick);
  }, [onTermClick, content.body]);
  useEffect(() => () => stopSpeak(), []);
  return (
    <Sheet onClose={onClose}>
      <button className={`listen ${speaking ? 'speaking':''}`} onClick={handleListen} aria-label="Read this aloud" title="Listen aloud" style={{top:'1.1rem', right:'3.4rem'}}>
        {speaking ? '◼' : '◀)'}
      </button>
      <div className="sheet-eyebrow">STEP · {minToClock(ev?.tMin || 0)}</div>
      <h2 className="sheet-title">{content.title}</h2>
      <div className="sheet-body" ref={bodyRef} dangerouslySetInnerHTML={{__html: content.body}}/>
    </Sheet>
  );
};

/* ============================================================
   Component: Main Phase 4 view
   ============================================================ */

const Phase4 = ({ onboarding }) => {
  const [elapsedSec, setElapsedSec] = useState(0);   // seconds of test time
  const [speed, setSpeed]           = useState(60);  // x times real-time
  const [paused, setPaused]         = useState(false);
  const [activeSheet, setActiveSheet] = useState(null);  // null | 'symptom' | 'tree' | 'med' | 'iv' | 'gloss' | 'act' | 'steps' | 'about' | 'preview'
  const [sheetData, setSheetData]   = useState(null);
  const [log, setLog]               = useState([]);
  const [voiceOverride, setVoiceOverride] = useState(null);
  const [textScale, setTextScale]   = useState(1);       // D1
  const [showOrient, setShowOrient] = useState(true);    // E5
  const [previewId, setPreviewId]   = useState(null);    // D3

  // D1 · apply the chosen text scale live to all content via the --fs variable
  useEffect(() => {
    document.documentElement.style.setProperty('--fs', textScale);
    return () => document.documentElement.style.setProperty('--fs', 1);
  }, [textScale]);

  // Determine effective voice
  const effectiveVoice = voiceOverride
    ?? (onboarding.role === 'caregiver' ? 'caregiver'
      : onboarding.role === 'both' ? 'caregiver'  // both renders caregiver by default in this prototype
      : onboarding.age === 'young' ? 'young'
      : onboarding.age === 'middle' ? 'middle'
      : 'teen');

  // Tick the clock
  useEffect(() => {
    if (paused) return;
    const id = setInterval(() => {
      setElapsedSec(s => Math.min(TOTAL_MIN * 60, s + speed));
    }, 1000);
    return () => clearInterval(id);
  }, [paused, speed]);

  const elapsedMin = elapsedSec / 60;
  const currentEvent = useMemo(() => findCurrentEvent(elapsedMin), [elapsedMin]);

  // Open medication sheet automatically when arginine or glucagon event hits — only once per event
  const lastAutoEvent = useRef(null);
  useEffect(() => {
    if (currentEvent.id === lastAutoEvent.current) return;
    lastAutoEvent.current = currentEvent.id;
    // No auto-popup in this build to avoid being intrusive — left as hook
  }, [currentEvent.id]);

  const openTerm = (t) => { setSheetData(t); setActiveSheet('gloss'); };

  const onLogSymptom = (sx) => {
    setLog(l => [...l, { atMin: elapsedMin, symptomId: sx.id }]);
    setSheetData(sx);
    setActiveSheet('tree');
  };
  const onFeelGood = () => { setActiveSheet(null); };

  const ackTree = () => { setActiveSheet(null); };

  // Stop speech on unmount
  useEffect(() => () => stopSpeak(), []);

  return (
    <>
      <StatusBar elapsedMin={elapsedMin} currentEvent={currentEvent}/>
      <DemoBar speed={speed} setSpeed={setSpeed} paused={paused} setPaused={setPaused}/>
      <VoiceBar effectiveVoice={effectiveVoice} voiceOverride={voiceOverride} setVoiceOverride={setVoiceOverride} textScale={textScale} setTextScale={setTextScale}/>

      <div className="main">
        {showOrient && <OrientationCard onDismiss={() => setShowOrient(false)}/>}

        <Timeline elapsedMin={elapsedMin} onTickClick={(t) => { setPreviewId(t.id); setActiveSheet('preview'); }}/>

        <StepCard event={currentEvent} voice={effectiveVoice} onTermClick={openTerm}/>

        <SymptomLog log={log}/>

        <div className="tl-section">
          <div className="section-head">QUICK ACCESS</div>
          <div className="stack" style={{gap:'.5rem'}}>
            <button className="chip" style={{alignSelf:'flex-start'}} onClick={() => setActiveSheet('steps')}>
              ◷ All steps — look back or ahead
            </button>
            <button className="chip" style={{alignSelf:'flex-start'}} onClick={() => setActiveSheet('med')}>
              💊 About the two medications
            </button>
            <button className="chip" style={{alignSelf:'flex-start'}} onClick={() => setActiveSheet('iv')}>
              🦾 IV placement walkthrough (3D)
            </button>
            <button className="chip" style={{alignSelf:'flex-start'}} onClick={() => { setSheetData(null); setActiveSheet('gloss'); }}>
              📖 Glossary (all terms)
            </button>
            <button className="chip" style={{alignSelf:'flex-start'}} onClick={() => setActiveSheet('act')}>
              🎨 Things to do during waits
            </button>
          </div>
        </div>

        <div className="srcline">
          Based on the standard GH stim-test protocol · reviewed {SOURCE.reviewed}<br/>
          <button onClick={() => setActiveSheet('about')}>About this information</button>
        </div>
      </div>

      <div className="dock">
        <button className="dock-btn primary" onClick={() => setActiveSheet('symptom')}>
          <span className="dock-btn-icon">✦</span>
          <span className="dock-btn-label">How I feel</span>
        </button>
        <button className="dock-btn" onClick={() => setActiveSheet('iv')}>
          <span className="dock-btn-icon">🦾</span>
          <span className="dock-btn-label">IV</span>
        </button>
        <button className="dock-btn" onClick={() => setActiveSheet('med')}>
          <span className="dock-btn-icon">💊</span>
          <span className="dock-btn-label">Meds</span>
        </button>
        <button className="dock-btn" onClick={() => { setSheetData(null); setActiveSheet('gloss'); }}>
          <span className="dock-btn-icon">📖</span>
          <span className="dock-btn-label">Words</span>
        </button>
      </div>

      {activeSheet === 'symptom' && (
        <SymptomCheckSheet
          onClose={() => setActiveSheet(null)}
          onLog={onLogSymptom}
          onFeelGood={onFeelGood}/>
      )}
      {activeSheet === 'tree' && sheetData && (
        <DecisionTreeSheet
          symptom={sheetData}
          onClose={() => setActiveSheet(null)}
          onAck={ackTree}/>
      )}
      {activeSheet === 'med' && (
        <MedicationSheet onClose={() => setActiveSheet(null)} voice={effectiveVoice}/>
      )}
      {activeSheet === 'iv' && (
        <IVStubSheet onClose={() => setActiveSheet(null)} voice={effectiveVoice}/>
      )}
      {activeSheet === 'gloss' && (
        <GlossarySheet termId={sheetData} onClose={() => setActiveSheet(null)}/>
      )}
      {activeSheet === 'act' && (
        <ActivitySheet onClose={() => setActiveSheet(null)} age={effectiveVoice === 'caregiver' ? 'teen' : effectiveVoice}/>
      )}
      {activeSheet === 'steps' && (
        <AllStepsSheet
          elapsedMin={elapsedMin}
          onClose={() => setActiveSheet(null)}
          onPick={(id) => { setPreviewId(id); setActiveSheet('preview'); }}/>
      )}
      {activeSheet === 'preview' && previewId && (
        <StepPreviewSheet
          eventId={previewId}
          voice={effectiveVoice}
          onClose={() => setActiveSheet(null)}
          onTermClick={openTerm}/>
      )}
      {activeSheet === 'about' && (
        <AboutSheet onClose={() => setActiveSheet(null)}/>
      )}
    </>
  );
};

/* ============================================================
   App root
   ============================================================ */

const App = () => {
  const [onboarding, setOnboarding] = useState(null);

  if (!onboarding) {
    return (
      <div className="app">
        <Onboarding onComplete={setOnboarding}/>
      </div>
    );
  }

  return (
    <div className="app">
      <Phase4 onboarding={onboarding}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
